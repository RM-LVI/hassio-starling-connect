name: Starling Connect Bridge
version: "0.1.0"
slug: starling_connect
description: >-
  Read-only bridge from a Starling Home Hub (Developer Connect API) into Home
  Assistant via MQTT discovery: doorbell press, camera online status, lock
  state and battery, and home/away.
url: "https://github.com/RM-LVI/hassio-starling-connect"
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
init: false
startup: application
boot: auto
services:
  - "mqtt:need"
options:
  hub_host: ""
  api_key: ""
  doorbell_poll_seconds: 1
  slow_poll_seconds: 60
  discovery_prefix: homeassistant
  log_level: info
schema:
  hub_host: str
  api_key: password
  doorbell_poll_seconds: int(1,)
  slow_poll_seconds: int(5,)
  discovery_prefix: str?
  log_level: "list(trace|debug|info|warning|error)?"
